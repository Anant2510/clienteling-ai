# Builds Clienteling AI on every push to main, then:
#   1. publishes the build to the `vm-build` branch, which the CX Nova VM mirrors
#      (https://cxnova2.centralindia.cloudapp.azure.com/clienteling-ai/)
#   2. deploys the same build to GitHub Pages (until that copy is retired)
#
# AI calls go through the Cloudflare Worker (VITE_PROXY_URL), which holds the API key.
# No API key is ever built into the site.
name: Build and deploy (CX Nova VM + GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # publish the vm-build branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          # Cloudflare Worker URL (not a secret). Override with a repo variable VITE_PROXY_URL.
          VITE_PROXY_URL: ${{ vars.VITE_PROXY_URL || 'https://aso-demo-proxy.anant-jadon25.workers.dev' }}
        run: npm run build

      - name: Guard against shipping an API key
        run: |
          if grep -rqE 'sk-ant-[A-Za-z0-9_-]{20,}' dist; then
            echo "::error::An API key ended up in the build. Remove it before deploying."; exit 1
          fi

      - name: Publish the build for the CX Nova VM (branch vm-build)
        run: |
          cd dist
          git init -q
          git checkout -q -b vm-build
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Build of ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" vm-build

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
